name: TasticLobby
version: '${version}'
main: de.tasticgames.lobby.TasticLobbyPlugin
description: Lobby systems and gameplay for the TasticGames network
author: TasticGames
website: https://tasticgames.de
api-version: '1.21.11'

depend:
  - TasticCore
softdepend:
  - PlaceholderAPI
  - Multiverse-Core
  - LuckPerms
  - Citizens
  - ModelEngine
  - MythicMobs
  - ItemsAdder
  - HMCCosmetics
  - WorldEdit
  - FastAsyncWorldEdit
  - TAB

commands:
  # /lobby, /hub and /l are TasticProxy commands; the proxy forwards them to this plugin while the
  # player is on a lobby server (see docs/tasticproxy-architecture.md).
  lobby:
    description: Return to the lobby spawn (also leaves the cookie open world)
    aliases: [hub, l]
  spawn:
    description: Teleport to the lobby spawn
  lang:
    description: Change your language (Deutsch, English, हिन्दी)
    usage: /lang [de|en|hi]
    aliases: [language, sprache]
  profile:
    description: Open a player profile
    usage: /profile [player]
  settings:
    description: Open your settings
  gateway:
    description: Open the TasticGateway
    aliases: [play, games]
  cosmetics:
    description: Open your cosmetics
  # /friend, /party and /clan are network-wide TasticProxy commands; the social dialog opens via /social
  social:
    description: Open the social hub (friends, party, clan)
    aliases: [socialhub]
  cookie:
    description: Cookie Clicker menu
    usage: /cookie [menu|stats|leaderboard|world|shop|upgrades|prestige]
  tasticlobby:
    description: TasticLobby administration
    usage: /tasticlobby status|reload|player <name>|setspawn|build|region|cosmetic ...
    permission: tasticlobby.status
  cookieadmin:
    description: Cookie Clicker administration
    usage: /cookieadmin status|addcookies|setcookies|setprestige|reset|unlock|balance|setcookie|npc|golden|zone|poi ...
    permission: tasticlobby.cookie.admin

permissions:
  tasticlobby.admin:
    description: All TasticLobby administration
    default: op
    children:
      tasticlobby.status: true
      tasticlobby.reload: true
      tasticlobby.build: true
      tasticlobby.setspawn: true
      tasticlobby.cookie.admin: true
      tasticlobby.cosmetic.admin: true
      tasticlobby.fly: true
      tasticlobby.visibility.always: true
  tasticlobby.status:
    default: op
  tasticlobby.reload:
    default: op
  tasticlobby.build:
    default: op
  tasticlobby.setspawn:
    default: op
  tasticlobby.cookie.admin:
    default: op
  tasticlobby.cosmetic.admin:
    default: op
  tasticlobby.fly:
    description: Flight in the lobby
    default: op
  tasticlobby.visibility.always:
    description: Always visible for other players regardless of their visibility setting
    default: false

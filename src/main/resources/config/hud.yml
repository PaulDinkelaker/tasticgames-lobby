# TasticLobby top-screen HUD (replaces scoreboards / UltimateUI). Rendered natively with boss bars:
# always on top of the held item, centered at the top, one line per row. Context follows the item in
# the hand (Cookie, Social, Gateway, Profile, Cosmetics, Settings, Visibility, plain lobby).
enabled: true
# ticks between refreshes (10 = twice per second)
refresh-ticks: 10
rows:
  values: true      # [context] title + 4 icon/value pairs
  # Own hint row (controls / commands). Off by default so the HUD only uses three rows - the hint is then
  # shown in the objective row whenever the context has no objective of its own.
  hint: false
  objective: true   # goal / progress line
  status: true      # rank | playtime | online (always the same)
# ItemsAdder styling (soft dependency): icons from font images and dark rounded boxes behind each cell.
# TasticLobby exports its own ItemsAdder content pack (plugins/ItemsAdder/contents/tasticgames) with the box
# glyphs and a transparent boss bar texture – run /iazip once after the first start (see docs/tasticlobby-hud.md).
itemsadder:
  icons: true
  boxes: true
  export-content: true
  # run /iazip automatically (console) once ItemsAdder has loaded when the export wrote new files
  auto-zip: true
  # boss bar colour whose textures are made transparent by the exported content (keep in sync with the export)
  bossbar-color: PINK
  # box glyphs (exported content); 16 px high, drawn behind the text
  box:
    left: "tasticgames:hud_box_left"
    middle: "tasticgames:hud_box_mid"
    right: "tasticgames:hud_box_right"
    padding: 6
    gap: 6
  # Pixels the client advances after an ItemsAdder font image beyond the width ItemsAdder reports.
  # 0 = the reported width is the advance (ItemsAdder 3.6/4.x). Set 1 if boxes render narrower than
  # their text (text starts left of the box) – then the client adds the 1 px glyph spacing itself.
  glyph-spacing: 0
  # semantic icon key -> ItemsAdder font image (namespace:id). Unknown ids fall back to the unicode icon.
  # These point at the two UI icon packs installed from plugins/TasticLobby/icon-packs/:
  #   minimalui            20 plain interface glyphs (settings, search, lock, home, ...)
  #   narra_icons_items   116 coloured pixel icons (crowns, gems, trophies, coins, ...)
  # Every key also has a unicode fallback below, so a missing pack costs looks, not function.
  icons-map:
    lobby: "minimalui:home"
    cookie: "narra_icons_items:gold_coin"
    social: "narra_icons_items:group_users"
    gateway: "narra_icons_items:compass_badge"
    profile: "narra_icons_items:id_card"
    cosmetics: "narra_icons_items:purple_gem"
    settings: "minimalui:settings"
    visibility: "narra_icons_items:eye_view"
    cookies: "narra_icons_items:coin_pile"
    cps: "narra_icons_items:flame"
    prestige: "narra_icons_items:gold_star"
    generators: "narra_icons_items:wrench"
    friends: "narra_icons_items:profile_pair"
    party: "narra_icons_items:group_users"
    clan: "narra_icons_items:blue_shield_badge"
    requests: "narra_icons_items:sealed_letter"
    survival: "narra_icons_items:sprout_hand"
    modes: "narra_icons_items:island_marker"
    # the Moon Disciples rank pack ships real font images (namespace moon_ranks) - kept for the status row
    rank: "moon_ranks:moon_rank_blue_moon_1"
    playtime: "narra_icons_items:stopwatch"
    session: "narra_icons_items:stopwatch"
    kills: "narra_icons_items:crossed_swords"
    deaths: "narra_icons_items:red_cross_token"
    orders: "narra_icons_items:scroll_document"
    creative: "narra_icons_items:magic_wand"
    duels: "narra_icons_items:crossed_swords"
    lifetime: "narra_icons_items:cash_stack"
    achievements: "narra_icons_items:gold_trophy"
    visible: "narra_icons_items:eye_view"
    cosmetics_owned: "narra_icons_items:purple_gem"
    hat: "narra_icons_items:gold_crown"
    aura: "narra_icons_items:green_orb"
    trail: "narra_icons_items:blue_orb_core"
    title: "narra_icons_items:parchment_map"
    language: "narra_icons_items:blue_book"
    music: "narra_icons_items:volume_on"
    sounds: "narra_icons_items:volume_on"
    online: "narra_icons_items:globe"

# UI icon packs the operator drops into plugins/TasticLobby/icon-packs/ (.zip or unpacked folder).
# They are installed into plugins/ItemsAdder/contents/<namespace>/ on every start and only rewritten
# when the source changed; afterwards the ItemsAdder pack is regenerated (/iazip).
icon-packs:
  enabled: true


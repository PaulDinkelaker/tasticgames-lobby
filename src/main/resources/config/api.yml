# TasticGames API connection for TasticLobby.
# Precedence: environment (TASTIC_API_BASE_URL, TASTIC_API_SERVICE, TASTIC_API_KEY, TASTIC_LOBBY_SERVER_ID)
#           → this file → plugins/TasticCore/config/api.yml (base-url + authentication of TasticCore are reused
#             automatically when api-key below is empty/CHANGE_ME, so a fresh install needs no second key).
enabled: true
base-url: ""
authentication:
  service-name: "tastic-core-lobby"
  api-key: "CHANGE_ME"
timeouts:
  connect-seconds: 5
  request-seconds: 10
# id of this backend as registered in TasticProxy (used as telemetry source / transfer requester)
server-id: "lobby"

# Cookie Clicker – layout, runtime and balancing. Coordinates are data: builders adjust them
# without code changes (/cookieadmin setcookie|npc|zone|special ... write into this file).
# config-version 4: main cookie in the lobby world, cookie world = prestige-10 open world; the quest NPCs are the
# baker (mama_bakewell) and the merchant (gustave). Existing files are migrated automatically:
#   2 -> 3 removes the NPCs babette and king_frosting
#   3 -> 4 renames "golden-cookies" to "special-cookies" and replaces balancing.golden with balancing.special
#          (lifetime-seconds and buff-seconds are carried over, base-interval-seconds is dropped – the wait between
#           two special cookies is now drawn from min/max/floor-interval-seconds instead of rolled every second)
config-version: 4

# ---------------------------------------------------------------------------------------------
# The MAIN COOKIE stands in the lobby. Clicking it earns cookies; the actionbar shows the balance.
main-cookie:
  world: "spawn"
  location: { x: -62.5, y: 35.0, z: 12.5, yaw: 0.0, pitch: 0.0 }
  # Visual backend, first available wins:
  #   1. MythicMobs mob type (carries the ModelEngine model configured by the builders)
  #   2. ModelEngine model attached to an invisible base entity
  #   3. native item display (vanilla cookie)
  mythicmobs-type: "fv_cookie_clicker"
  # MythicMobs skill cast on the mob for every bake click (hit animation); damage itself is blocked by the lobby
  click-skill: "fv_cookie_clicker_hit"
  model: "fv_cookie_clicker"
  # click hitbox (an Interaction entity in front of the model – works with every backend)
  hitbox: { width: 2.2, height: 2.4 }
  # floating "Click me" label above the cookie – off, the fv_cookie_clicker model carries its own hologram
  label: false
  # Cookie zone: generators only produce and the actionbar only shows while the player is within this
  # radius (blocks) of the main cookie (or inside the open world). Left click = bake, right click = menu.
  zone-radius: 8.0
  actionbar:
    interval-millis: 1000
  special-cookies:
    enabled: true
    # auto  = the special cookie activates for the player directly (title + reward, nothing to find)
    # spawn = it appears near the player in the world and has to be clicked within its lifetime
    mode: auto
    # special cookies only trigger inside these areas (lobby: around the main cookie)
    areas:
      bakery_plaza:
        world: "spawn"
        min: { x: -82, y: 30, z: -8 }
        max: { x: -42, y: 46, z: 32 }

# Quest NPCs (Citizens when installed, otherwise native villagers). "world" defaults to the main-cookie world.
# entity-type PLAYER + skin-value/skin-signature = custom skin (Citizens); "skin: <name>" fetches a player's skin instead.
# citizens-id links an NPC created by an admin with /npc create instead of spawning one.
npcs:
  enabled: true
  list:
    mama_bakewell:
      role: QUEST
      quest: starter
      location: { x: -66.5, y: 35.0, z: 8.5, yaw: -45.0 }
      entity-type: PLAYER
      skin: ""
      skin-value: ""
      skin-signature: ""
      model: "mama_bakewell"
    gustave:
      role: QUEST
      quest: explore
      location: { x: -58.5, y: 35.0, z: 8.5, yaw: 45.0 }
      entity-type: PLAYER
      skin: ""
      skin-value: ""
      skin-signature: ""
      model: "gustave_the_barrel"

# ---------------------------------------------------------------------------------------------
# The OPEN WORLD is the endgame area for players who reached prestige 10 (/cookie world, cookie menu).
open-world:
  enabled: true
  world: "cookie"
  # a flat development world is created automatically when the world does not exist
  create-if-missing: true
  required-prestige: 10
  entry: { x: 0.5, y: -60.0, z: 0.5, yaw: 0.0, pitch: 0.0 }
  special-cookies:
    enabled: true
    mode: auto
    # empty = anywhere in the open world
    areas: {}


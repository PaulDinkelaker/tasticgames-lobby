# POIs (analytics/telemetry; ids are prefixed with "cookie." automatically). "world" defaults to the open world;
# the main cookie POI lives in the lobby.
pois:
  main_cookie: { world: "spawn", x: -62.5, y: 35.0, z: 12.5, radius: 6.0, type: MAIN_COOKIE }
  zone_sugar_fields: { x: 120.5, y: -60.0, z: 0.5, radius: 6.0, type: ZONE_ENTRY }
  zone_cocoa_caverns: { x: 240.5, y: -60.0, z: 0.5, radius: 6.0, type: ZONE_ENTRY }

runtime:
  save-interval-seconds: 10
  max-dirty-age-seconds: 30
  leaderboard-cache-seconds: 60
  max-save-failures-before-pause: 30

# balancing overrides (defaults live in the domain engine, see docs/cookie-clicker.md)
balancing:
  cost-growth: 1.15
  max-clicks-per-second: 15
  combo-window-millis: 800
  combo-decay-millis: 3000
  # generators only run inside the cookie zone – offline production stays disabled by default
  offline:
    enabled: false
    max-seconds: 28800
    efficiency: 0.5
  # Special cookies: every player has their own timer, drawn as
  #   uniform(min-interval-seconds, max-interval-seconds) / chance multiplier
  # and never shorter than floor-interval-seconds. The chance multiplier comes from the golden_luck upgrade (x1.5)
  # and the lucky_charms tree node (+10 %/level), so those now shorten the wait. lifetime-seconds only matters in
  # mode "spawn". The rarity is drawn by weight over the rarities the player's prestige level unlocked
  # (silver/golden at prestige 1, platinum at 2, diamond at 4, master at 7 – prestige 0 gets none at all);
  # the weights are additionally scaled per player by the rarity upgrades and the connoisseur tree node.
  # A reward type with weight 0 never rolls for that rarity (no chain bonus below golden, blessing is diamond+).
  special:
    min-interval-seconds: 900
    max-interval-seconds: 7200
    floor-interval-seconds: 300
    lifetime-seconds: 45
    # While a special click buff runs, one click can never pay more than this many seconds of unbuffed
    # production. Without it a x7777 click frenzy plus an autoclicker is worth hours of CPS per activation
    # (0 disables the clamp).
    click-clamp-cps-seconds: 60
    # Per rarity: draw weight, which reward types it can roll, and how strong each of them is.
    # lucky/chain are always capped by BOTH a bank fraction and a window of unbuffed CPS.
    rarities:
      silver:
        weight: 60
        reward-weights: { LUCKY: 50, FRENZY: 40, CLICK_FRENZY: 10 }
        lucky: { bank-fraction: 0.05, cps-seconds: 300, flat-bonus: 13 }
        frenzy: { multiplier: 3, seconds: 30 }
        click-frenzy: { multiplier: 30, seconds: 12 }
      golden:
        weight: 30
        reward-weights: { LUCKY: 45, FRENZY: 35, CLICK_FRENZY: 10, CHAIN_BONUS: 10 }
        lucky: { bank-fraction: 0.15, cps-seconds: 900, flat-bonus: 13 }
        chain: { bank-fraction: 0.05, cps-seconds: 900 }
        frenzy: { multiplier: 7, seconds: 30 }
        click-frenzy: { multiplier: 777, seconds: 3 }
      platinum:
        weight: 7
        reward-weights: { LUCKY: 40, FRENZY: 35, CLICK_FRENZY: 15, CHAIN_BONUS: 10 }
        lucky: { bank-fraction: 0.25, cps-seconds: 1800, flat-bonus: 0 }
        chain: { bank-fraction: 0.08, cps-seconds: 1800 }
        frenzy: { multiplier: 15, seconds: 45 }
        click-frenzy: { multiplier: 1500, seconds: 4 }
      diamond:
        weight: 3.0
        reward-weights: { LUCKY: 35, FRENZY: 30, CLICK_FRENZY: 20, BLESSING: 15 }
        lucky: { bank-fraction: 0.40, cps-seconds: 2700, flat-bonus: 0 }
        frenzy: { multiplier: 30, seconds: 60 }
        click-frenzy: { multiplier: 2000, seconds: 5 }
        blessing: { cps-multiplier: 30, click-multiplier: 100, seconds: 30 }
      master:
        weight: 1.5
        reward-weights: { LUCKY: 30, FRENZY: 25, CLICK_FRENZY: 20, BLESSING: 25 }
        lucky: { bank-fraction: 0.77, cps-seconds: 5400, flat-bonus: 0 }
        frenzy: { multiplier: 77, seconds: 77 }
        click-frenzy: { multiplier: 7777, seconds: 3 }
        blessing: { cps-multiplier: 77, click-multiplier: 250, seconds: 45 }

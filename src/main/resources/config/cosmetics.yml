# Cosmetic catalog. Domain ids are stable; 'render' is renderer specific data:
#   HMCCosmetics (preferred when installed): render: "hmc:<hmccosmetics-cosmetic-id>"  (slot/model come from HMCCosmetics)
#   native renderer: HAT material:<MATERIAL>[;model:<ns:key>], AURA/TRAIL/JOIN_EFFECT particle:<PARTICLE>[;count:n][;color:RRGGBB]
# unlock: DEFAULT | PRESTIGE_<n> | ACHIEVEMENT_<id> | ADMIN
# Asset packs: drop the cosmetic pack ZIPs into plugins/TasticLobby/cosmetic-packs/ and TasticLobby installs
# their ItemsAdder content and HMCCosmetics definitions on every start (idempotent, menus are never overwritten),
# rebuilds the ItemsAdder pack and reloads HMCCosmetics. The cosmetics below reference the installed ids via
# render: "hmc:<hmccosmetics-id>".
packs:
  enabled: true
  # reload HMCCosmetics after new content was installed (off = reload it yourself with /hmccosmetics reload)
  reload-hmccosmetics: true

cosmetics:
  title_newcomer:
    category: TITLE
    rarity: COMMON
    preview: NAME_TAG
    unlock: DEFAULT
    sort: 1
  factory_title:
    category: TITLE
    rarity: RARE
    preview: PISTON
    unlock: PRESTIGE_3
    unlock-requirement-key: lobby.cosmetics.requirement.prestige_3

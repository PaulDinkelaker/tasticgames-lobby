# TasticLobby – core lobby configuration
world:
  # name of the lobby world (loaded by the server / Multiverse before TasticLobby starts)
  name: "spawn"
  spawn:
    world: "spawn"
    x: -23.5
    y: 37.0
    z: -3.5
    yaw: 0.0
    pitch: 0.0
  # players falling below this Y are teleported back to spawn
  void-rescue-y: 0.0
  fixed-time:
    enabled: true
    ticks: 6000
  clear-weather: true
  disable-mob-spawning: true
  disable-player-collision: true
  suppress-join-quit-messages: true
  allow-staff-flight: true

movement:
  launchpads:
    enabled: true
    material: SLIME_BLOCK
    vertical-velocity: 1.35
    forward-velocity: 0.9
    cooldown-millis: 600
    sound: "minecraft:entity.firework_rocket.launch"
    # optional directional pads: region -> fixed velocity (define with /tasticlobby region launchpad <id> from a WorldEdit selection)
    directional: {}
    #  bridge-jump:
    #    world: "spawn"
    #    min: { x: 10, y: 36, z: 10 }
    #    max: { x: 12, y: 37, z: 12 }
    #    velocity: { x: 0.0, y: 1.4, z: 2.5 }
  teleport-pads:
    enabled: true
    material: GOLD_BLOCK
    # false = only gold blocks inside 'regions' teleport (decorative gold stays usable)
    everywhere: false
    # define with /tasticlobby region teleport <id> from a WorldEdit selection
    regions: {}
    #  spawn-ring:
    #    world: "spawn"
    #    min: { x: -30, y: 30, z: -30 }
    #    max: { x: 30, y: 45, z: 30 }
    cooldown-millis: 1500
    sound: "minecraft:entity.enderman.teleport"
  double-jump:
    enabled: false
    velocity: 0.9
    cooldown-millis: 1500

# The top-screen HUD is rendered by TasticLobby itself (config/hud.yml); the tablist by TAB. The same
# values are available as placeholders (%tastic_...% via PlaceholderAPI and TAB) – see docs/tasticlobby-integrations.md.
placeholders:
  # refresh interval used for TAB placeholders (milliseconds)
  refresh-millis: 1000

telemetry:
  enabled: true
  queue-capacity: 5000
  batch-size: 200
  flush-interval-seconds: 5
  position-sample-seconds: 4

# TasticLobby service NPCs – the greeters in the lobby that open the season pass, route players to a
# game mode or open the Cookie Clicker menu. Citizens backed (entity-type PLAYER, protected, never
# persisted); without Citizens the lobby falls back to native entities and the skins are ignored.
# Coordinates are data: builders move the NPCs without code changes.
# yaw convention: 0 = south, 90 = west, 180 = north, -90 = east.
#
# action:
#   PASS      opens the TasticPass overview dialog
#   TRANSFER  requests a routed transfer to "target" (SURVIVAL/CREATIVE/DUELS) via TasticProxy
#   COOKIE    opens the Cookie Clicker menu
#   NONE      sends an info message only
# skin.value/skin.signature are a Mojang texture pair; "skin-name" fetches a player's skin instead.
# mirror-skin: true shows every player their own skin (Citizens MirrorTrait) – used for Survival.
# Display names are localized per NPC via the message keys lobby.npc.<id>.name (Citizens nameplates
# are global, so the English name is used above the NPC).
enabled: true

# NPCs turn towards nearby players.
look-close: true

npcs:
  # TasticPass greeter (skin: the network owner Ctastic_official).
  # Also respects "npc" in config/pass.yml – the pass module's own switch for this NPC.
  pass:
    action: PASS
    world: "spawn"
    x: -72.5
    y: 36.0
    z: 11.5
    yaw: 180.0
    skin:
      value: ""
      signature: ""

  # Creative – builder/architect look
  creative:
    action: TRANSFER
    target: CREATIVE
    x: -77.5
    y: 36.0
    z: 1.5
    yaw: -90.0
    skin:
      value: ""
      signature: ""

  # Survival – mirrors the viewer's own skin, so everyone meets themselves
  survival:
    action: TRANSFER
    target: SURVIVAL
    x: -76.5
    y: 36.0
    z: -3.5
    yaw: -90.0
    mirror-skin: true

  # Duels – knight/warrior look
  duels:
    action: TRANSFER
    target: DUELS
    x: -77.5
    y: 36.0
    z: -8.5
    yaw: -90.0
    skin:
      value: ""
      signature: ""

  # Games & events – opens the Cookie Clicker menu
  games:
    action: COOKIE
    x: -72.5
    y: 36.0
    z: -18.5
    yaw: -90.0
    skin:
      value: ""
      signature: ""

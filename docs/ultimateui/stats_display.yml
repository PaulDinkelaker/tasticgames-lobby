# TasticGames – kontextabhängiges Top-Screen-HUD für UltimateUI (ersetzt das Scoreboard).
# Alle Werte kommen aus TasticLobby (PlaceholderAPI-Expansion "tastic"); der Kontext wechselt automatisch mit dem
# Item in der Hand: leer/sonstiges = Lobby, Cookie = Cookie Clicker, Social, Gateway, Profil, Cosmetics, Settings,
# Sichtbarkeit. Keine %img_...%-Bilder – nur Standard-Schriftzeichen und Placeholders.
#   %tastic_ctx_title%            Kontext-Titel (🍪 Cookie Clicker, ☻ Social, ✈ Gateway, ★ Profil, ✎ Cosmetics, ⚙ Einstellungen, 👁 Sichtbarkeit, ☀ TasticGames)
#   %tastic_ctx_label_1..4%       Beschriftungen, %tastic_ctx_value_1..4% zugehörige Werte
#   %tastic_ctx_hint%             Hinweiszeile (Steuerung/Befehle), %tastic_ctx_objective% Ziel-/Fortschrittszeile
# Test: /papi parse me %tastic_ctx_title% – wechselt beim Item-Wechsel in der Hotbar.
name: Stats Display
blocks:
# ---- obere Leiste: Kontext-Titel + 4 Wertepaare (Boxen von links nach rechts)
- type: text
  id: text
  name: Kontext
  layer: 2.0

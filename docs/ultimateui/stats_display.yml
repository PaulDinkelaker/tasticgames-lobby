# TasticGames – kontextabhängiges Top-Screen-HUD für UltimateUI (ersetzt das Scoreboard).
# Block-Geometrie = mitgelieferte "Stats Display"-Vorlage (112/120/86/93/418/278 px, opacity 106) – diese Glyphen
# liegen im Standard-Pack; die Statusbox rechts nutzt den 264x35-Block deines Scoreboards. Keine %img_...%-Bilder.
# Kontext wechselt mit dem Item in der Hand (Cookie, Social, Gateway, Profil, Cosmetics, Settings, Sichtbarkeit, Lobby).
# Test: /papi parse me %tastic_ctx_title%
name: Stats Display
behavior:
  keep-open: true
  reopen: false
  close-on-death: false
  close-on-damage: false
  close-on-f: false
  close-on-shift-f: true
open-on-join:
  enabled: true
  type: hud
  delay: 20
blocks:
# ---- Box 1 (112 px): Kontext-Titel
- type: text
  id: text
  name: Kontext
  layer: 2.0
  opacity: 255
  color: ffffff
  text: '<font:default><#ffd82b>%tastic_ctx_title%'
